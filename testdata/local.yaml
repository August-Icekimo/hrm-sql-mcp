# 本機開發用政策（podman 容器 HRM_TEST_0205）
#
# 正式的政策檔住在被服務的專案裡（HRM 是 mcp/hrm-sql.yaml）。
# 這一份留在 repo 內只作為開發與整合測試用的樣本。
#
# 三個目標是同一台伺服器上不同時間點的測試快照，彼此只差在時間點與測試對象，
# 都不是正式環境的完整還原。宣告成多個目標是為了能互相比對——一個發現究竟是
# 缺陷，還是「那份快照的時間比較早」，只有並排看才分得出來。
server:
  name: hrm-sql-mcp
  version: 0.1.0

profile: local

targets:
  - alias: hrm_0209
    host: 127.0.0.1
    port: 1433
    database: hrm
    note: "2026-02-09 還原的測試快照"
    # 三個目標共用同一個登入。沒有這個欄位就要把同一組帳密在憑證檔裡抄三遍，
    # 而抄三遍的密碼是輪替時會漏掉兩份的密碼。
    credential_key: local_hrm
    # 容器只綁本機，allow_cidrs 收得比實際更緊沒有壞處
    allow_cidrs: ["127.0.0.0/8"]
    encrypt: true
    # 容器用自簽憑證。這給的是「有加密但不驗證伺服器身分」，
    # 本機 loopback 可接受；連 UAT 時要重新評估。
    trust_server_certificate: true
    app_name: hrm-sql-mcp
    writable: true

  - alias: hrm_0424
    host: 127.0.0.1
    port: 1433
    database: hrm_0424
    note: "2026-04-27 還原的測試快照"
    credential_key: local_hrm
    allow_cidrs: ["127.0.0.0/8"]
    encrypt: true
    trust_server_certificate: true
    app_name: hrm-sql-mcp
    writable: false

  - alias: hrm_0511
    host: 127.0.0.1
    port: 1433
    database: hrm_0511
    note: "2026-05-22 還原的測試快照（程序數明顯較少，形狀與另外兩份不同）"
    credential_key: local_hrm
    allow_cidrs: ["127.0.0.0/8"]
    encrypt: true
    trust_server_certificate: true
    app_name: hrm-sql-mcp
    writable: false

limits:
  max_rows: 500
  max_bytes: 1048576
  query_timeout: 30s
  execute_timeout: 120s
  lock_timeout: 5s

paths:
  sp_dir: "Stored Procedure"
  schema_dict: ".gemini/database_schema.md"
  java_src_dir: "src"

audit:
  file: "~/.local/state/hrm-sql-mcp/audit.jsonl"
  snapshot_dir: "~/.local/state/hrm-sql-mcp/snapshots"
